<!--
  COMPARISON TABLE STYLES
  Paste this whole block ONCE into:
    Webflow > Site settings > Custom code > Head code
  (or the CMS Template page's Page settings > Custom code > Inside <head> tag)
  Then publish. Every table inserted with the snippets will pick up these styles.
-->
<style>
  .cmp-table {
    --cmp-brand: #034F87;
    --cmp-text: #1A2D3D;
    --cmp-border: #B3B9BE;
    --cmp-tint: #F2F6F9;       /* light brand tint for zebra rows */
    --cmp-label-bg: #E6EEF4;   /* row-label column background */
    --cmp-radius: 8px;

    margin: 2rem 0;
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--cmp-border);
    border-radius: var(--cmp-radius);
    color: var(--cmp-text);
  }

  .cmp-table table {
    width: 100%;
    margin: 0;
    border-collapse: collapse;
    border-spacing: 0;
    table-layout: fixed;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--cmp-text);
    background: #fff;
  }

  .cmp-table caption {
    caption-side: top;
    padding: 0.875rem 1.25rem;
    text-align: left;
    font-weight: 700;
    font-size: 1.125rem;
    color: var(--cmp-brand);
    background: #fff;
    border-bottom: 1px solid var(--cmp-border);
  }

  .cmp-table th,
  .cmp-table td {
    padding: 0.875rem 1.25rem;
    text-align: left;
    vertical-align: top;
    border: 0;
    border-bottom: 1px solid var(--cmp-border);
    border-right: 1px solid var(--cmp-border);
    overflow-wrap: break-word;
  }

  .cmp-table th:last-child,
  .cmp-table td:last-child {
    border-right: 0;
  }

  .cmp-table tbody tr:last-child th,
  .cmp-table tbody tr:last-child td {
    border-bottom: 0;
  }

  /* Header row */
  .cmp-table thead th {
    background: var(--cmp-brand);
    color: #fff;
    font-weight: 700;
    border-right-color: rgba(255, 255, 255, 0.25);
    border-bottom: 0;
  }

  /* Zebra striping */
  .cmp-table tbody tr:nth-child(even) td {
    background: var(--cmp-tint);
  }

  /* First column = row labels */
  .cmp-table tbody th {
    background: var(--cmp-label-bg);
    color: var(--cmp-text);
    font-weight: 600;
  }

  /* 3-column tables: give the label column a little less room */
  .cmp-table--3col th:first-child,
  .cmp-table--3col td:first-child {
    width: 28%;
  }

  /* Tick / cross helpers (optional) */
  .cmp-table .cmp-yes,
  .cmp-table .cmp-no {
    font-weight: 700;
  }
  .cmp-table .cmp-yes { color: #1B7A3E; }
  .cmp-table .cmp-no  { color: #B42318; }

  /* Mobile */
  @media (max-width: 600px) {
    .cmp-table {
      margin: 1.5rem 0;
    }
    .cmp-table table {
      font-size: 0.9375rem;
    }
    .cmp-table th,
    .cmp-table td,
    .cmp-table caption {
      padding: 0.75rem 0.875rem;
    }
  }
</style>
